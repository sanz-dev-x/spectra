name: Spectra APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK rilis (bukan debug)
        shell: bash
        env:
          SPECTRA_APP_NAME: Spectra
          SPECTRA_APPLICATION_ID: com.spectra.app
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --console=plain :app:assembleFossSpectra -x lint 2>&1 | tee build.log
      - if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED" -A4 build.log | head -60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Siapkan dan periksa spectra.apk
        shell: bash
        run: |
          find app/build/outputs -name '*.apk' -print
          APK=$(find app/build/outputs/apk/foss/spectra -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan di app/build/outputs/apk/foss/spectra"
            exit 1
          fi
          case "$APK" in
            *[Dd]ebug*) echo "APK hasil build bernama debug: $APK"; exit 1;;
          esac
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "aapt2 tidak ditemukan, pemeriksaan paket dilewati"
          else
            BADGING=$("$AAPT2" dump badging "$APK")
            PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
            echo "Package APK: $PKG"
            if [ "$PKG" != "com.spectra.app" ]; then
              echo "Package harus com.spectra.app, ditemukan: $PKG"
              exit 1
            fi
            if printf '%s\n' "$BADGING" | grep -q "application-debuggable"; then
              echo "APK bersifat debuggable (build debug), rilis dibatalkan."
              exit 1
            fi
          fi
          mkdir -p out
          cp "$APK" out/spectra.apk
          ls -la out
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f VERSION ]; then VERSION=$(tr -d '[:space:]' < VERSION); else VERSION="1.0.0.0.0"; fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/spectra.apk --clobber
          else
            gh release create "$TAG" out/spectra.apk --title "Spectra ${VERSION}" --notes "Versi ${VERSION}" --target "${{ github.sha }}" --latest
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
          {
            echo "### APK siap diunduh"
            echo "Versi ${VERSION}"
            echo ""
            echo "[Unduh spectra.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/spectra.apk)"
            echo ""
            echo "[Halaman rilis](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
