name: Spectra APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - shell: bash
        run: gradle --console=plain assembleFossSx -x lint 2>&1 | tee build.log
        env:
          SPECTRA_APP_NAME: Spectra
          SPECTRA_APPLICATION_ID: com.spectra.app
          SPECTRA_KEYSTORE_PATH: ${{ github.workspace }}/.github/spectra.jks
          SPECTRA_KEYSTORE_PASSWORD: "0000100101011010100000000001010100010001101011111000110110110100010111111100010011100000111101100000110011111111110011111110010011110110110100110100001100001100010100001011101011101110100000010000000010101001100101101001111000111110111100100101011001110100"
      - if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED" -A4 build.log | head -60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Siapkan spectra.apk
        run: |
          find app/build/outputs -name '*.apk' -print
          APK=$(find app/build/outputs/apk/foss/sx -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan di app/build/outputs/apk/foss/sx"
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/spectra.apk
          ls -la out
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f VERSION ]; then VERSION=$(tr -d '[:space:]' < VERSION); else VERSION="1.0.0.0.0"; fi
          EXISTING=$(gh release list --limit 300 --json tagName,name --jq ".[] | select(.name | startswith(\"Spectra ${VERSION} \")) | .tagName" | head -n 1)
          if [ -n "$EXISTING" ]; then
            TAG="$EXISTING"
            gh release upload "$TAG" out/spectra.apk --clobber
          else
            N=$(gh release list --limit 300 --json name --jq '[.[] | select(.name | test("#[0-9]+$"))] | length')
            N=$((N + 1))
            while gh release view "sx-$N" >/dev/null 2>&1; do N=$((N + 1)); done
            TAG="sx-$N"
            gh release create "$TAG" out/spectra.apk --title "Spectra ${VERSION} #${N}" --notes "Versi ${VERSION}" --target "${{ github.sha }}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
          {
            echo "### APK siap diunduh"
            echo "Versi ${VERSION}, rilis ${TAG}"
            echo ""
            echo "[Unduh spectra.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/spectra.apk)"
            echo ""
            echo "[Halaman rilis](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
